# Codemagic — IPA (Sideloadly) + APK Android
# Sem expo-dev-client: o binário embute o JS e NÃO precisa de Metro.
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/
#
# WORKFLOWS
# - android-apk  → build/GMarket.apk
# - ios-sideloadly → build/GMarket-sideloadly.ipa (unsigned; re-assinar no Sideloadly)
#
# SECRETS / GROUPS (Codemagic UI → Environment variables)
# - android_fcm: GOOGLE_SERVICES_JSON (obrigatório para push Android)
# - Opcional: GOOGLE_MAPS_API_KEY (sem isto o MapView fica em branco no nativo)
#
# PUSH / NOTIFICAÇÕES
# - Android APK: exige GOOGLE_SERVICES_JSON (secret) com Firebase package com.gmarket.app.
#   Backend → Expo Push API → FCM v1. Sem este ficheiro o push em background/fechado falha.
# - iOS Sideloadly: IPA UNSIGNED (CODE_SIGNING_ALLOWED=NO). Sideloadly re-assina no PC.
#   LIMITAÇÃO: push remoto APNs NÃO é fiável neste fluxo (sem entitlement/assinatura Apple
#   de distribuição). Use este workflow para UI/testes sem depender de push remoto.
# - iOS push remoto com app FECHADO: use EAS Build assinado
#   (eas build --platform ios --profile preview ou production) com APNs Key no
#   expo.dev → Project → Credentials. Bundle: com.gmarket.app.

workflows:
  android-apk:
    name: Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_fcm
      node: 22.14.0
      java: 17
      vars:
        EXPO_PUBLIC_API_URL: https://gmarket-api-proxy.puzzling-apricot.workers.dev
        NODE_ENV: production
        REQUIRE_ANDROID_FCM: "1"
        # Defina GOOGLE_MAPS_API_KEY nas Environment variables do Codemagic (ou num group)
        # para mapas nativos no APK.
    scripts:
      - name: Install npm dependencies
        script: |
          set -euo pipefail
          npm ci || npm install
      - name: Verify TypeScript
        script: |
          set -euo pipefail
          npx tsc --noEmit --pretty false
      - name: Ensure production (no expo-dev-client)
        script: |
          set -euo pipefail
          npm uninstall expo-dev-client || true
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['package.json', 'app.json']) {
            if (!fs.existsSync(file)) continue;
            const raw = fs.readFileSync(file, 'utf8');
            const json = JSON.parse(raw);
            if (json.dependencies) delete json.dependencies['expo-dev-client'];
            if (json.devDependencies) delete json.devDependencies['expo-dev-client'];
            if (Array.isArray(json.expo?.plugins)) {
              json.expo.plugins = json.expo.plugins.filter((plugin) => {
                const name = Array.isArray(plugin) ? plugin[0] : plugin;
                return name !== 'expo-dev-client';
              });
            }
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          }
          NODE
      - name: Configure Firebase (FCM push em background/fechado)
        script: |
          set -euo pipefail
          node scripts/prepare-push-android.mjs
      - name: Generate Android native project
        script: |
          set -euo pipefail
          export CI=1
          export NODE_ENV=production
          npx expo prebuild --platform android --clean
          if [ ! -f "$CM_BUILD_DIR/google-services.json" ]; then
            echo "ERROR: google-services.json em falta após prepare-push-android"
            exit 1
          fi
          if ! grep -q 'com.gmarket.app' "$CM_BUILD_DIR/android/app/build.gradle" \
            && ! grep -q 'com.gmarket.app' "$CM_BUILD_DIR/android/app/build.gradle.kts" 2>/dev/null; then
            echo "WARN: confirme applicationId com.gmarket.app no projeto Android gerado"
          fi
      - name: Set Android SDK location
        script: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build release APK
        script: |
          set -euo pipefail
          export CI=1
          export NODE_ENV=production
          cd "$CM_BUILD_DIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p "$CM_BUILD_DIR/build"
          APK="$(find "$CM_BUILD_DIR/android/app/build/outputs/apk" -name '*.apk' -print | head -n 1)"
          if [ -z "${APK:-}" ]; then
            echo "ERROR: APK not found"
            find "$CM_BUILD_DIR/android/app/build/outputs" -type f | head -80 || true
            exit 1
          fi
          cp -f "$APK" "$CM_BUILD_DIR/build/GMarket.apk"
          ls -lh "$CM_BUILD_DIR/build/GMarket.apk"
    artifacts:
      - build/*.apk
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - deivimramalho@gmail.com
        notify:
          success: true
          failure: true

  ios-sideloadly:
    name: iOS IPA (Sideloadly)
    # LIMITAÇÃO PUSH: este IPA é unsigned. NÃO usar para validar push remoto APNs.
    # Para push com app fechado: EAS Build iOS (profile preview/production) + APNs Key no Expo.
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22.14.0
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: GMarket.xcworkspace
        XCODE_SCHEME: GMarket
        EXPO_PUBLIC_API_URL: https://gmarket-api-proxy.puzzling-apricot.workers.dev
        NODE_ENV: production
        # Defina GOOGLE_MAPS_API_KEY nas Environment variables do Codemagic (ou num group)
        # para mapas nativos no IPA.
    scripts:
      - name: Install npm dependencies
        script: |
          set -euo pipefail
          npm ci || npm install
      - name: Verify TypeScript
        script: |
          set -euo pipefail
          npx tsc --noEmit --pretty false
      - name: Ensure production (no expo-dev-client)
        script: |
          set -euo pipefail
          npm uninstall expo-dev-client || true
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['package.json', 'app.json']) {
            if (!fs.existsSync(file)) continue;
            const raw = fs.readFileSync(file, 'utf8');
            const json = JSON.parse(raw);
            if (json.dependencies) delete json.dependencies['expo-dev-client'];
            if (json.devDependencies) delete json.devDependencies['expo-dev-client'];
            if (Array.isArray(json.expo?.plugins)) {
              json.expo.plugins = json.expo.plugins.filter((plugin) => {
                const name = Array.isArray(plugin) ? plugin[0] : plugin;
                return name !== 'expo-dev-client';
              });
            }
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          }
          NODE
      - name: Generate iOS native project
        script: |
          set -euo pipefail
          export CI=1
          export NODE_ENV=production
          npx expo prebuild --platform ios --clean
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          cat ios/.xcode.env.local
          echo "NOTE: Sideloadly IPA is UNSIGNED — APNs remote push is NOT guaranteed."
          echo "Use EAS signed iOS build to validate closed-app push (com.gmarket.app)."
      - name: Install CocoaPods
        script: |
          set -euo pipefail
          cd ios && pod install
      - name: Pre-bundle JS for Release
        script: |
          set -euo pipefail
          export CI=1
          export NODE_ENV=production
          mkdir -p "$CM_BUILD_DIR/ios"
          npx expo export:embed \
            --platform ios \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output "$CM_BUILD_DIR/ios/main.jsbundle" \
            --assets-dest "$CM_BUILD_DIR/ios" \
            --bytecode
          ls -lh "$CM_BUILD_DIR/ios/main.jsbundle"
      - name: Build unsigned IPA for Sideloadly
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios"
          export NODE_BINARY="$(which node)"
          export CI=1
          export NODE_ENV=production

          mkdir -p "$CM_BUILD_DIR/build"
          LOG_FILE="$CM_BUILD_DIR/build/xcodebuild-archive.log"

          set +e
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/GMarket.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            NODE_BINARY="$NODE_BINARY" \
            archive 2>&1 | tee "$LOG_FILE"
          XCODE_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$XCODE_STATUS" -ne 0 ]; then
            echo "ERROR: xcodebuild archive failed ($XCODE_STATUS)"
            echo "---- last errors ----"
            grep -E "error:|fatal error:|❌|Command PhaseScriptExecution failed|EMBEDDED_BINARY|Provisioning|Code Sign|No such module|Undefined symbols" "$LOG_FILE" | tail -80 || true
            echo "---- tail log ----"
            tail -120 "$LOG_FILE" || true
            exit "$XCODE_STATUS"
          fi

          APP_PATH="$(find "$CM_BUILD_DIR/build/GMarket.xcarchive/Products/Applications" -name '*.app' -print -quit)"
          if [ -z "${APP_PATH:-}" ]; then
            echo "ERROR: .app not found in archive"
            exit 1
          fi

          # Garante JS + assets no .app (Sideloadly sem Metro)
          cp -f "$CM_BUILD_DIR/ios/main.jsbundle" "$APP_PATH/main.jsbundle"
          if [ -d "$CM_BUILD_DIR/ios/assets" ]; then
            rm -rf "$APP_PATH/assets"
            cp -R "$CM_BUILD_DIR/ios/assets" "$APP_PATH/assets"
          fi

          if [ ! -f "$APP_PATH/main.jsbundle" ]; then
            echo "ERROR: main.jsbundle missing inside .app — app ficaria presa no splash"
            ls -la "$APP_PATH" | head -60
            exit 1
          fi

          echo "JS bundle size: $(wc -c < "$APP_PATH/main.jsbundle") bytes"
          file "$APP_PATH/main.jsbundle" || true
          ls -la "$APP_PATH" | head -40

          rm -rf "$CM_BUILD_DIR/build/ipa"
          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/ipa/Payload/"
          (
            cd "$CM_BUILD_DIR/build/ipa"
            zip -qry "$CM_BUILD_DIR/build/GMarket-sideloadly.ipa" Payload
          )
          ls -lh "$CM_BUILD_DIR/build/GMarket-sideloadly.ipa"
          echo "LIMITAÇÃO: este IPA NÃO valida push APNs. Use EAS iOS assinado para push fechado."
    artifacts:
      - build/*.ipa
      - build/*.log
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      email:
        recipients:
          - deivimramalho@gmail.com
        notify:
          success: true
          failure: true
