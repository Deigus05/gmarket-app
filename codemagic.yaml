# Codemagic — IPA para instalar no iPhone com Sideloadly (Apple ID grátis, ~7 dias)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/

workflows:
  ios-sideloadly:
    name: iOS IPA (Sideloadly)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22.14.0
      xcode: latest
      cocoapods: default
      vars:
        # Nome gerado pelo `expo prebuild` a partir de app.json → name: "GMarket"
        XCODE_WORKSPACE: GMarket.xcworkspace
        XCODE_SCHEME: GMarket
        EXPO_PUBLIC_API_URL: https://gmarket-backend-production.up.railway.app
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Generate iOS native project
        script: |
          npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build unsigned IPA for Sideloadly
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios"

          # Release embute o JS (não precisa de Metro). Sideloadly volta a assinar com o teu Apple ID.
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/GMarket.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

          APP_PATH="$(find "$CM_BUILD_DIR/build/GMarket.xcarchive/Products/Applications" -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found in archive"
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/build/ipa"
          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/ipa/Payload/"
          (
            cd "$CM_BUILD_DIR/build/ipa"
            zip -qry "$CM_BUILD_DIR/build/GMarket-sideloadly.ipa" Payload
          )
          ls -lh "$CM_BUILD_DIR/build/GMarket-sideloadly.ipa"
    artifacts:
      - build/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      email:
        recipients:
          - deivimramalho@gmail.com
        notify:
          success: true
          failure: true
